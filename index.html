<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Asylum: Run & Hide</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier Prime', monospace;
            user-select: none;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- تأثيرات الرعب (Outlast Style) --- */
        
        /* 1. ضوضاء الكاميرا */
        #static-noise {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyBAMAAADsEZWCAAAAGFBMVEUAAAA5OTkAAABERERmZmYzMzMyMjJQUFBgj+ukAAAACHRSTlMAMwAqzMzMzM7U0B4AAABKSURBVDjLY2AYBaNg2AJGJiBpC2QZUqIDqGMwKgKVAqUBkI1YsoTYrxgwIzNBZCphxQ7QxIw5BMiZhFC/ApGDJCKjUgqBiG0A8oI4kWQG4xL0A0yBlAOH3x9/kAAB4wD8UjBxEQAAAABJRU5ErkJggg=='); 
            pointer-events: none;
            z-index: 5;
            opacity: 0.15;
            animation: noiseAnim 0.1s steps(5) infinite;
        }

        @keyframes noiseAnim {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-5%, -5%); }
            20% { transform: translate(-10%, 5%); }
            30% { transform: translate(5%, -10%); }
            40% { transform: translate(-5%, 15%); }
            50% { transform: translate(-10%, 5%); }
            60% { transform: translate(15%, 0); }
            70% { transform: translate(0, 10%); }
            80% { transform: translate(-15%, 0); }
            90% { transform: translate(10%, 5%); }
            100% { transform: translate(5%, 0); }
        }

        /* 2. الرؤية الليلية */
        body.night-vision-active {
            filter: sepia(100%) hue-rotate(90deg) contrast(1.2) brightness(1.2);
        }
        
        /* 3. الدم والظلال */
        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.95) 100%);
            z-index: 4;
            pointer-events: none;
        }
        
        #blood-splatter {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 80% 80%, rgba(50,0,0,0.4), transparent 50%);
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        /* واجهة المستخدم */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        .rec-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff0000;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .rec-dot {
            width: 15px;
            height: 15px;
            background: red;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .objective {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.8);
            font-size: 1.5rem;
            text-align: center;
            text-shadow: 0 0 5px #000;
            animation: fadeObj 4s forwards;
        }
        @keyframes fadeObj { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

        .battery-hud {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 1.2rem;
        }
        .bar-bg { width: 150px; height: 10px; background: #333; margin-top: 5px; }
        .bar-fill { height: 100%; background: #ddd; width: 100%; transition: 0.2s; }
        .bar-fill.low { background: red; }

        .stamina-hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            text-align: right;
        }

        /* شاشات المقدمة والنهاية */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
        }
        
        .title { font-size: 4rem; color: #800000; text-shadow: 0 0 20px #500; margin-bottom: 20px; letter-spacing: 5px; font-family: 'Courier Prime'; }
        .btn { padding: 15px 40px; font-size: 1.5rem; background: transparent; border: 2px solid #fff; color: #fff; cursor: pointer; margin-top: 30px; transition: 0.3s; font-family: 'Courier Prime'; }
        .btn:hover { background: #fff; color: #000; }

        /* تأثير الصدمة (Jumpscare) */
        #jumpscare-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: red;
            z-index: 200;
            display: none;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="game-container"></div>
    <div id="static-noise"></div>
    <div id="vignette"></div>
    <div id="blood-splatter"></div>
    <div id="jumpscare-overlay"></div>

    <!-- واجهة اللعب -->
    <div id="ui-layer">
        <div class="rec-indicator"><div class="rec-dot"></div> REC ●</div>
        <div class="battery-hud">
            CAM BATTERY<br>
            <div class="bar-bg"><div class="bar-fill" id="batt"></div></div>
        </div>
        <div class="stamina-hud">
            STAMINA<br>
            <div class="bar-bg" style="width:100px"><div class="bar-fill" id="stam"></div></div>
        </div>
        <div class="controls-hint">
            W,A,S,D : Move<br>
            SHIFT : Run<br>
            F : Flashlight<br>
            N : Night Vision<br>
            E : Interact
        </div>
    </div>

    <!-- شاشة البداية -->
    <div id="start-screen" class="overlay">
        <div class="title">MOUNT MASSIVE</div>
        <p style="color: #aaa; max-width: 500px; line-height: 1.6;">
            You are an investigative journalist. Something went wrong in Block C.<br>
            Find the Security Key. Don't let <b>IT</b> catch you.
        </p>
        <button class="btn" onclick="startGame()">ENTER ASYLUM</button>
    </div>

    <!-- شاشة الفوز/الموت -->
    <div id="end-screen" class="overlay" style="display: none;">
        <h1 id="end-title" style="font-size: 3rem; color: red;">YOU DIED</h1>
        <p id="end-desc">The patient caught you.</p>
        <button class="btn" onclick="location.reload()">TRY AGAIN</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Sound Engine (Synthesizer for Horror) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'chase') {
                // موسيقى المطاردة السريعة (Drone bass)
                osc.type = 'sawtooth';
                osc.frequency.value = 50;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.5);
                gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 1);
                osc.start();
                osc.stop(audioCtx.currentTime + 1);
            } else if (type === 'breath') {
                // أنين الوحش
                osc.type = 'triangle';
                osc.frequency.value = 80;
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 1);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 3);
                osc.start();
                osc.stop(audioCtx.currentTime + 3);
            } else if (type === 'scream') {
                // صرخة عند الاستيقاظ
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
                gain.gain.value = 0.5;
                osc.start();
                osc.stop(audioCtx.currentTime + 1.5);
            } else if (type === 'footstep') {
                // خطوة ثقيلة
                osc.type = 'square';
                osc.frequency.value = 40;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        // --- Game Setup ---
        let scene, camera, renderer;
        let player, monster;
        let flashlight, nightVisionOn = false;
        let battery = 100;
        let stamina = 100;
        let isGameRunning = false;
        let isGameOver = false;

        // Inputs
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let isRunning = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();
        let euler = new THREE.Euler(0, 0, 0, 'YXZ');

        // Game Objects
        let keyObject, doorObject;
        let keyCollected = false;
        let monsterChasing = false;

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.15);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Lighting
            const amb = new THREE.AmbientLight(0x111111);
            scene.add(amb);

            flashlight = new THREE.SpotLight(0xffffff, 1.5, 20, Math.PI/5, 0.5, 1);
            flashlight.castShadow = true;
            flashlight.position.set(0.5, -0.5, 0);
            camera.add(flashlight);
            camera.add(flashlight.target);
            scene.add(camera);

            buildAsylum();
            buildMonster();
            
            // Events
            document.addEventListener('keydown', (e) => handleKey(e.code, true));
            document.addEventListener('keyup', (e) => handleKey(e.code, false));
            document.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onResize);

            animate();
        }

        function buildAsylum() {
            // Materials
            const tileMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.2 }); // Clean tiles
            const dirtyMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 }); // Dark walls
            const bloodMat = new THREE.MeshStandardMaterial({ color: 0x550000 });

            // Floor (Tiles)
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 60), tileMat);
            floor.rotation.x = -Math.PI/2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Ceiling
            const ceil = new THREE.Mesh(new THREE.PlaneGeometry(10, 60), tileMat);
            ceil.rotation.x = Math.PI/2;
            ceil.position.y = 3;
            scene.add(ceil);

            // Walls
            const createWall = (x, y, z, w, h, ry) => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.5), dirtyMat);
                wall.position.set(x, y, z);
                wall.rotation.y = ry;
                wall.receiveShadow = true;
                scene.add(wall);
            };
            createWall(5.25, 1.5, 0, 60, 3, Math.PI/2); // Left
            createWall(-5.25, 1.5, 0, 60, 3, Math.PI/2); // Right
            createWall(0, 1.5, -30, 10, 3, 0); // Back
            
            // Exit Door
            doorObject = new THREE.Mesh(new THREE.BoxGeometry(3, 3.5, 0.2), new THREE.MeshStandardMaterial({color: 0x222}));
            doorObject.position.set(0, 1.75, 29.8);
            doorObject.userData = { locked: true, open: false };
            scene.add(doorObject);

            // The Key
            const keyGeo = new THREE.TorusKnotGeometry(0.1, 0.03, 64, 8);
            const keyMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
            keyObject = new THREE.Mesh(keyGeo, keyMat);
            keyObject.position.set(2, 1, -10); // Placed far back
            scene.add(keyObject);

            // Blood Stains (Decor)
            for(let i=0; i<5; i++) {
                const blood = new THREE.Mesh(new THREE.CircleGeometry(Math.random()+0.5, 16), bloodMat);
                blood.rotation.x = -Math.PI/2;
                blood.position.set((Math.random()-0.5)*8, 0.01, (Math.random()*50)-25);
                scene.add(blood);
            }
        }

        function buildMonster() {
            monster = new THREE.Group();
            
            // Skin color (Raw meat)
            const skinMat = new THREE.MeshStandardMaterial({ color: 0x880000, roughness: 0.6 });

            // Body (Hunched)
            const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.5), skinMat);
            body.position.y = 1.5;
            body.rotation.x = 0.5; // Hunch forward
            monster.add(body);

            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.4), skinMat);
            head.position.set(0, 2.3, 0.3);
            monster.add(head);

            // Long Arms (Dragging)
            const armGeo = new THREE.BoxGeometry(0.2, 1.2, 0.2);
            const armL = new THREE.Mesh(armGeo, skinMat);
            armL.position.set(-0.6, 1.2, 0.8);
            armL.rotation.x = -1.5;
            monster.add(armL);
            
            const armR = new THREE.Mesh(armGeo, skinMat);
            armR.position.set(0.6, 1.2, 0.8);
            armR.rotation.x = -1.5;
            monster.add(armR);

            // Legs (Stiff)
            const legGeo = new THREE.BoxGeometry(0.3, 1.5, 0.3);
            const legL = new THREE.Mesh(legGeo, skinMat);
            legL.position.set(-0.3, 0.2, -0.5);
            monster.add(legL);
            const legR = new THREE.Mesh(legGeo, skinMat);
            legR.position.set(0.3, 0.2, -0.5);
            monster.add(legR);

            monster.position.set(0, 0, 25); // Waiting at the end
            monster.visible = false; // Hidden initially
            scene.add(monster);
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'block';
            isGameRunning = true;
            document.body.requestPointerLock();
            
            // Intro Objective
            const obj = document.createElement('div');
            obj.className = 'objective';
            obj.innerHTML = "OBJECTIVE:<br>Find the Security Key";
            document.getElementById('ui-layer').appendChild(obj);

            // Ambient Sound
            if (audioCtx.state === 'suspended') audioCtx.resume();
            playSound('breath');
        }

        function handleKey(code, isDown) {
            if (!isGameRunning) return;
            switch (code) {
                case 'KeyW': case 'ArrowUp': moveForward = isDown; break;
                case 'KeyS': case 'ArrowDown': moveBackward = isDown; break;
                case 'KeyA': case 'ArrowLeft': moveLeft = isDown; break;
                case 'KeyD': case 'ArrowRight': moveRight = isDown; break;
                case 'ShiftLeft': isRunning = isDown; break;
                case 'KeyF': 
                    if (isDown) { 
                        flashlightOn = !flashlightOn; 
                        flashlight.intensity = flashlightOn ? 1.5 : 0;
                    }
                    break;
                case 'KeyN':
                    if (isDown) {
                        nightVisionOn = !nightVisionOn;
                        document.body.classList.toggle('night-vision-active');
                        if (nightVisionOn) flashlight.intensity = 0.5; // Night vision needs some light but less than normal
                        else flashlight.intensity = flashlightOn ? 1.5 : 0;
                    }
                    break;
                case 'KeyE':
                    if (isDown) interact();
                    break;
            }
        }

        function onMouseMove(e) {
            if (!isGameRunning) return;
            euler.setFromQuaternion(camera.quaternion);
            euler.y -= e.movementX * 0.002;
            euler.x -= e.movementY * 0.002;
            euler.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, euler.x));
            camera.quaternion.setFromEuler(euler);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function interact() {
            // Collect Key
            if (!keyCollected) {
                const dist = camera.position.distanceTo(keyObject.position);
                if (dist < 3) {
                    keyCollected = true;
                    scene.remove(keyObject);
                    // Trigger Monster
                    monster.visible = true;
                    monsterChasing = true;
                    playSound('scream');
                    
                    // UI Update
                    const obj = document.querySelector('.objective');
                    obj.innerHTML = "OBJECTIVE:<br>GET TO THE EXIT DOOR!";
                    obj.style.animation = 'none'; obj.offsetHeight; obj.style.animation = null; // reset anim
                    
                    // Show Battery drain warning if NV is on
                }
            }
            // Open Door
            if (keyCollected && !doorObject.userData.open) {
                const dist = camera.position.distanceTo(doorObject.position);
                if (dist < 4) {
                    doorObject.userData.open = true;
                    doorObject.rotation.y = Math.PI/2;
                    endGame(true);
                }
            }
        }

        function endGame(win) {
            isGameRunning = false;
            document.exitPointerLock();
            const screen = document.getElementById('end-screen');
            screen.style.display = 'flex';
            if (win) {
                document.getElementById('end-title').innerText = "ESCAPED";
                document.getElementById('end-title').style.color = "green";
                document.getElementById('end-desc').innerText = "You made it out alive... this time.";
            } else {
                document.getElementById('end-title').innerText = "KILLED";
                document.getElementById('end-desc').innerText = "The patient claimed another soul.";
            }
        }

        function gameOver() {
            // Jumpscare effect
            const js = document.getElementById('jumpscare-overlay');
            js.style.display = 'block';
            playSound('scream');
            setTimeout(() => endGame(false), 1000);
        }

        // --- Main Loop ---
        function animate() {
            requestAnimationFrame(animate);
            if (!isGameRunning) return;

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            // Movement Physics
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            let speed = isRunning && stamina > 0 ? 12.0 : 5.0;
            
            // Stamina Logic
            if (isRunning && (moveForward || moveBackward || moveLeft || moveRight)) {
                stamina -= 20 * delta;
            } else {
                stamina = Math.min(100, stamina + 10 * delta);
            }
            document.getElementById('stam').style.width = stamina + '%';

            if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

            camera.translateX(velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y = 1.7; // Lock height

            // Bounds (Corridor)
            if (camera.position.x > 4) camera.position.x = 4;
            if (camera.position.x < -4) camera.position.x = -4;
            if (camera.position.z > 28) camera.position.z = 28;
            if (camera.position.z < -28) camera.position.z = -28;

            // Camera Sway (Breathing/Running)
            if (moveForward || moveBackward || moveLeft || moveRight) {
                const swaySpeed = isRunning ? 15 : 8;
                const swayAmt = isRunning ? 0.05 : 0.02;
                camera.position.y = 1.7 + Math.sin(time * 0.001 * swaySpeed) * swayAmt;
            }

            // --- Mechanics ---

            // Battery
            if (nightVisionOn) {
                battery -= 5 * delta; // Night vision drains fast
                document.getElementById('batt').style.width = battery + '%';
                if (battery < 20) document.getElementById('batt').classList.add('low');
                if (battery <= 0) {
                    battery = 0;
                    nightVisionOn = false;
                    document.body.classList.remove('night-vision-active');
                    flashlight.intensity = 0;
                }
            } else if (flashlightOn) {
                battery -= 0.5 * delta;
                document.getElementById('batt').style.width = battery + '%';
            }

            // Key Animation
            if (!keyCollected) {
                keyObject.rotation.y += delta;
                keyObject.position.y = 1 + Math.sin(time * 0.003) * 0.1;
            }

            // --- Monster AI ---
            if (monsterChasing) {
                // Chase Music Loop
                if (Math.floor(time) % 60 === 0) playSound('chase');

                const dist = monster.position.distanceTo(camera.position);
                
                // Look at player
                monster.lookAt(camera.position.x, monster.position.y, camera.position.z);
                
                // Move
                let chaseSpeed = 6.5; // Fast runner
                monster.translateZ(chaseSpeed * delta);

                // Animation (Wild flailing)
                monster.rotation.x = Math.sin(time * 0.02) * 0.5;

                // Catch Player
                if (dist < 1.5) {
                    gameOver();
                }

                // Visual Fear Effect
                document.getElementById('blood-splatter').style.opacity = Math.max(0, (10 - dist) / 10);
                camera.fov = 75 + (10-dist)*2; // Zoom in when close
                camera.updateProjectionMatrix();
            } else {
                camera.fov = 75; // Reset FOV
                camera.updateProjectionMatrix();
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
