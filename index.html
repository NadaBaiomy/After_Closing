<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بعد الأذان - النسخة المرعبة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Amiri', serif; /* خط عربي تقليدي */
            user-select: none;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* تأثير الحبيبات (Film Grain) للرعب */
        #grain {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 5;
            animation: grainAnim 0.5s steps(5) infinite;
        }

        @keyframes grainAnim {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-5%, -10%); }
            20% { transform: translate(-15%, 5%); }
            30% { transform: translate(7%, -25%); }
            40% { transform: translate(-5%, 25%); }
            50% { transform: translate(-15%, 10%); }
            60% { transform: translate(15%, 0%); }
            70% { transform: translate(0%, 15%); }
            80% { transform: translate(3%, 35%); }
            90% { transform: translate(-10%, 10%); }
        }

        /* شاشة التحميل والمقدمة */
        #intro-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            transition: opacity 2s;
        }
        
        .fade-text {
            font-size: 1.5rem;
            margin: 20px;
            opacity: 0;
            text-align: center;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        #start-btn {
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            padding: 10px 30px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 50px;
            transition: 0.3s;
        }
        #start-btn:hover { background: #fff; color: #000; }

        /* HUD */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            z-index: 10;
        }

        #battery-container {
            position: absolute;
            top: 20px;
            right: 20px;
            font-family: 'Cairo', sans-serif;
        }
        #battery-bar {
            width: 100px;
            height: 5px;
            background: #333;
            margin-top: 5px;
        }
        #battery-level {
            height: 100%;
            background: #fff;
            width: 100%;
        }

        #noise-meter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 4px;
            background: #222;
        }
        #noise-fill {
            height: 100%;
            width: 0%;
            background: #ff0000;
        }

        /* تأثير الأذان المرعب */
        #adhan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .adhan-text {
            color: #d32f2f;
            font-size: 4rem;
            font-weight: bold;
            animation: pulseText 3s infinite;
        }
        @keyframes pulseText {
            0% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); text-shadow: 0 0 20px red; }
            100% { opacity: 0.5; transform: scale(1); }
        }

        /* تأثير الدم */
        #blood-fx {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(50,0,0,0.8) 100%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        /* تلميح التفاعل */
        #interaction-hint {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.7);
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            display: none;
        }

    </style>
</head>
<body>

    <div id="game-container"></div>
    <div id="grain"></div>
    <div id="blood-fx"></div>

    <!-- شاشة المقدمة -->
    <div id="intro-screen">
        <div id="loading-text" style="color: #555;">جاري تحميل البيئة...</div>
        <button id="start-btn" style="display:none;">استيقظ</button>
    </div>

    <!-- شاشة الأذان -->
    <div id="adhan-overlay">
        <div class="adhan-text">الله أكبر</div>
        <div style="color: #fff; margin-top: 20px; font-family: 'Cairo';">03:17 ص</div>
    </div>

    <!-- واجهة اللعب -->
    <div id="ui-layer">
        <div id="battery-container">
            <div style="font-size: 12px; color: #aaa;">كشاف اليد</div>
            <div id="battery-bar"><div id="battery-level"></div></div>
        </div>
        <div id="noise-meter"><div id="noise-fill"></div></div>
        <div id="interaction-hint">اضغط E للفتح</div>
    </div>

    <!-- مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- إعدادات الصوت (Audio Synthesis) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playHorrorSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'heartbeat') {
                osc.type = 'sine';
                osc.frequency.value = 60;
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'flicker') {
                osc.type = 'sawtooth';
                osc.frequency.value = 100 + Math.random() * 50;
                gainNode.gain.value = 0.05;
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'drone') {
                // صوت الخلفية المستمر
                osc.type = 'sine';
                osc.frequency.value = 40;
                gainNode.gain.value = 0.02;
                osc.start();
                // لا تتوقف، نحتاجها مستمرة لكن الخادم الصوتي قد يحصرها
                setTimeout(() => { gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2); osc.stop(audioCtx.currentTime + 2); }, 0);
            }
        }

        // --- إعدادات اللعبة ---
        let scene, camera, renderer;
        let flashlight, flashlightOn = true;
        let battery = 100;
        let isGameActive = false;
        let isGameOver = false;
        let zombie, door;
        
        // الحركة
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();
        let euler = new THREE.Euler(0, 0, 0, 'YXZ');

        // المؤثرات
        let noiseLevel = 0;
        let fearLevel = 0;
        let zombieSpeed = 0.03;

        function init() {
            // المشهد
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020202);
            scene.fog = new THREE.FogExp2(0x000000, 0.12); // ضباب كثيف جداً

            // الكاميرا
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);

            // الريندر
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // الإضاءة
            const ambient = new THREE.AmbientLight(0x111111);
            scene.add(ambient);

            // الكشاف
            flashlight = new THREE.SpotLight(0xffffee, 2, 25, Math.PI/6, 0.5, 1);
            flashlight.castShadow = true;
            flashlight.position.set(0,0,0);
            flashlight.target.position.set(0,0,-1);
            camera.add(flashlight);
            camera.add(flashlight.target);
            scene.add(camera);

            buildRoom();
            buildZombie();
            
            // Events
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onWindowResize);
            
            // Start Intro Sequence
            startIntroSequence();

            animate();
        }

        function buildRoom() {
            const texLoader = new THREE.TextureLoader();
            // نستخدم ألوان بسيطة لضمان عدم ظهور مشاكل في الصور
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.9 });
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });

            // أرضية
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), floorMat);
            floor.rotation.x = -Math.PI/2;
            floor.receiveShadow = true;
            scene.add(floor);

            // جدران (ممر طويل)
            const createWall = (x, y, z, w, h, ry) => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.5), wallMat);
                wall.position.set(x, y, z);
                wall.rotation.y = ry;
                wall.castShadow = true;
                wall.receiveShadow = true;
                scene.add(wall);
            };

            createWall(0, 2, -10, 20, 4, 0); // خلف
            createWall(-10, 2, 0, 20, 4, Math.PI/2); // يسار
            createWall(10, 2, 0, 20, 4, Math.PI/2); // يمين
            
            // باب
            door = new THREE.Mesh(new THREE.BoxGeometry(3, 3.5, 0.2), new THREE.MeshStandardMaterial({color: 0x221111}));
            door.position.set(0, 1.75, -9.7);
            door.castShadow = true;
            door.userData = { isOpen: false };
            scene.add(door);

            // تفاصيل (خزائن، أسرّة)
            for(let i=-5; i<5; i+=2.5) {
                const cabinet = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), wallMat);
                cabinet.position.set(i, 1, 9.5);
                cabinet.castShadow = true;
                scene.add(cabinet);
            }
        }

        function buildZombie() {
            zombie = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a }); // أسود حالك
            
            // جسم
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.8, 0.4), mat);
            body.position.y = 1.5;
            zombie.add(body);
            
            // رأس
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.5), mat);
            head.position.y = 2.8;
            zombie.add(head);

            // عيون حمراء
            const eyeGeo = new THREE.SphereGeometry(0.06);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const e1 = new THREE.Mesh(eyeGeo, eyeMat); e1.position.set(-0.15, 2.85, 0.26);
            const e2 = new THREE.Mesh(eyeGeo, eyeMat); e2.position.set(0.15, 2.85, 0.26);
            zombie.add(e1); zombie.add(e2);

            zombie.position.set(0, 0, 8); // في نهاية الممر
            zombie.castShadow = true;
            scene.add(zombie);
        }

        // --- منطق المقدمة ---
        function startIntroSequence() {
            const btn = document.getElementById('start-btn');
            const load = document.getElementById('loading-text');
            
            setTimeout(() => {
                load.style.display = 'none';
                btn.style.display = 'block';
            }, 1000);

            btn.onclick = () => {
                document.getElementById('intro-screen').style.opacity = 0;
                setTimeout(() => {
                    document.getElementById('intro-screen').style.display = 'none';
                    playAdhan();
                }, 2000);
                
                // تشغيل الصوت
                if (audioCtx.state === 'suspended') audioCtx.resume();
            };
        }

        function playAdhan() {
            const adhanDiv = document.getElementById('adhan-overlay');
            adhanDiv.style.display = 'flex';
            
            // صوت مفزع بسيط
            playHorrorSound('drone');

            setTimeout(() => {
                adhanDiv.style.display = 'none';
                startGame();
            }, 5000);
        }

        function startGame() {
            isGameActive = true;
            document.getElementById('ui-layer').style.display = 'block';
            document.body.requestPointerLock();
            
            // تشغيل نبضات القلب المتكررة
            setInterval(() => {
                if (!isGameOver && isGameActive) {
                    playHorrorSound('heartbeat');
                    // زيادة الخوف
                    if (fearLevel > 0) fearLevel += 1;
                }
            }, 1000);
        }

        // --- التحكم ---
        function onKeyDown(e) {
            if (!isGameActive) return;
            switch(e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'KeyF': toggleFlashlight(); break;
                case 'KeyE': interact(); break;
            }
        }

        function onKeyUp(e) {
            switch(e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function onMouseMove(e) {
            if (!isGameActive) return;
            const movementX = e.movementX || e.mozMovementX || e.webkitMovementX || 0;
            const movementY = e.movementY || e.mozMovementY || e.webkitMovementY || 0;

            euler.setFromQuaternion(camera.quaternion);
            euler.y -= movementX * 0.002;
            euler.x -= movementY * 0.002;
            euler.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, euler.x));
            camera.quaternion.setFromEuler(euler);
        }

        function toggleFlashlight() {
            if (battery > 0) {
                flashlightOn = !flashlightOn;
                flashlight.intensity = flashlightOn ? 2 : 0;
            }
        }

        function interact() {
            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = ray.intersectObject(door);
            if (hits.length > 0 && hits[0].distance < 4) {
                if (!door.userData.isOpen) {
                    door.userData.isOpen = true;
                    door.rotation.y = Math.PI/2;
                    noiseLevel = 100; // فتح الباب صوت عالي
                    document.getElementById('interaction-hint').style.display = 'none';
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- الحلقة الرئيسية ---
        function animate() {
            requestAnimationFrame(animate);

            if (!isGameActive) return;

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            // حركة اللاعب
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * 400.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 400.0 * delta;

            camera.translateX(velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y = 1.7; // تثبيت الارتفاع

            // حدود
            if (camera.position.z > 9.5) camera.position.z = 9.5;
            if (camera.position.z < -9.5) camera.position.z = -9.5;
            if (camera.position.x > 9) camera.position.x = 9;
            if (camera.position.x < -9) camera.position.x = -9;

            // --- ميكانيك الرعب ---
            
            // 1. الكشاف يرفرف عشوائياً
            if (flashlightOn && Math.random() < 0.02) {
                flashlight.intensity = Math.random() * 2;
                if (Math.random() < 0.1) playHorrorSound('flicker');
            }

            // 2. البطارية
            if (flashlightOn) {
                battery -= 0.5 * delta;
                document.getElementById('battery-level').style.width = battery + '%';
                if (battery < 20) document.getElementById('battery-level').style.background = 'red';
                if (battery <= 0) { battery = 0; flashlight.intensity = 0; flashlightOn = false; }
            }

            // 3. الزومبي AI
            const dist = zombie.position.distanceTo(camera.position);
            
            // حركة الزومبي (تنفس/اهتزاز)
            zombie.position.y = Math.sin(time * 0.003) * 0.05;

            // السمع
            let currentNoise = 0;
            if (moveForward || moveBackward || moveLeft || moveRight) currentNoise = 0.5;
            
            noiseLevel = Math.max(0, noiseLevel - 10 * delta);
            noiseLevel += currentNoise * 10;
            document.getElementById('noise-fill').style.width = noiseLevel + '%';

            // المطاردة
            if (dist < 8 && (noiseLevel > 50 || flashlightOn)) {
                zombie.lookAt(camera.position.x, zombie.position.y, camera.position.z);
                zombie.translateZ(zombieSpeed);
                fearLevel += 5 * delta;
                
                // قرب
                if (dist < 3) {
                    document.getElementById('blood-fx').style.opacity = 1;
                    if (dist < 1.0) {
                        isGameOver = true;
                        document.body.style.background = 'red';
                        alert("لقد انتهى الأمر...");
                        location.reload();
                    }
                } else {
                    document.getElementById('blood-fx').style.opacity = (3 - dist) / 3;
                }
            } else {
                document.getElementById('blood-fx').style.opacity = 0;
                fearLevel = Math.max(0, fearLevel - 1 * delta);
            }

            // التحقق من الباب للتفاعل
            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = ray.intersectObject(door);
            if (hits.length > 0 && hits[0].distance < 4 && !door.userData.isOpen) {
                document.getElementById('interaction-hint').style.display = 'block';
            } else {
                document.getElementById('interaction-hint').style.display = 'none';
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
